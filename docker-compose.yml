services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: carbon_footprint
      POSTGRES_USER: carbon_user
      POSTGRES_PASSWORD: carbon_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
